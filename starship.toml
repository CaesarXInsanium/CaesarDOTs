add_newline=false

format="$hostname$directory$fill$all$git_branch$git_status\n$shell$character"
# format="$character$all$fill$shell$username$directory"

[fill]
symbol = " "

[line_break]
disabled = true

[character] # The name of the module we are configuring is 'character'
success_symbol = '[>](bold green)' # The 'success_symbol' segment is being set to '➜' with the color 'bold green'

[username]
format = "[$user]($style) "
show_always = false
style_root = "bold fg:red"
style_user = "bold italic fg:cyan"

# Second param
[hostname]
disabled = false
format = "SSH@[$hostname]($style) "
ssh_only = true
style = "bold dimmed red"
trim_at = "-"

# Third param
[shell]
fish_indicator = "󰈺"
powershell_indicator = "_"
disabled = true
bash_indicator = "B"
zsh_indicator = "󰰶"
style = "fg:cyan bg:black bold"

[directory]
style = "bold"
truncate_to_repo = true
truncation_length = 9
truncation_symbol = " "
read_only="R"
home_symbol="~"

# Fourth param
[sudo]
disabled = true

# Before all the version info (python, nodejs, php, etc.)
[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
deleted = "x"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
style = "white"

# Last param in the first line/row
[cmd_duration]
disabled = false
format = "command took [$duration]($style)"
min_time = 30

[time]
disabled = true
format = " 🕙 $time($style)"
style = "bright-white"
time_format = "%T"

# Prompt: param 2

# SYMBOLS
[status]
disabled = false
format = '[\[$symbol$status_common_meaning$status_signal_name$status_maybe_int\]]($style)'
map_symbol = true
pipestatus = true
symbol = "🔴"

[aws]
symbol = " "

